[package]
name = "spex-cli"
version = "0.2.0"
edition = "2024"

[dependencies]
spex-core = { path = "../spex-core" }
spex-net = { path = "../spex-net" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
